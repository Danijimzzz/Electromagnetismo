name: Comprobar simulador
on:
  pull_request:
  push:
    branches: [main]
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      # El runner ya trae Google Chrome; descargar Chromium con --with-deps se quedaba colgado.
      - name: Build, ejercicios (ejemplo y Tema 3) y consola del navegador
        run: node pruebas/comprobar.js
        env:
          CHROMIUM: /usr/bin/google-chrome
      - name: publico/ está al día con fuente/
        run: git add -N publico && git diff --exit-code publico/ README.md CLAUDE.md
