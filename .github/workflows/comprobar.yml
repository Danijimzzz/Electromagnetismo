name: Comprobar simulador
on:
  pull_request:
  push:
    branches: [main]
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Build, ejercicios (ejemplo y Tema 3) y consola del navegador
        run: node pruebas/comprobar.js
      - name: publico/ está al día con fuente/
        run: git add -N publico && git diff --exit-code publico/
