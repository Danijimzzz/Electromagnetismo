name: Comprobar simulador
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # Rápido y sin navegador: falla en segundos si al juntar ramas quedó un marcador de conflicto, un JSON o .js roto,
  # una clave repetida en catalogo.js / version.js o scripts que no compilan juntos (pruebas/union.js)
  union:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node pruebas/union.js
  comprobar:
    # Las herramientas se reparten en 4 trozos que corren a la vez (node pruebas/comprobar.js --parte N/4), igualados por lo que
    # tarda cada una (pruebas/tiempos.json; se rehace con --tiempos); lo común (portada, asignaturas, Electrostática…) va en el trozo 1.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 axe-core@4.10.2
      # El runner ya trae Google Chrome; descargar Chromium con --with-deps se quedaba colgado.
      - name: Build, ejercicios (ejemplo y Tema 3) y consola del navegador (trozo ${{ matrix.parte }} de 4)
        run: node pruebas/comprobar.js --parte ${{ matrix.parte }}/4
        env:
          CHROMIUM: /usr/bin/google-chrome
      - name: publico/ está al día con fuente/
        if: matrix.parte == 1
        run: git add -N publico && git diff --exit-code publico/ README.md CLAUDE.md
  # F15.2: los casos límite de todos los campos (unos 10 minutos) en su propio trabajo, para que no dependan de acordarse
  limites:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 axe-core@4.10.2
      - name: Casos límite en los campos de todas las herramientas (sin NaN, Infinity ni errores)
        run: node pruebas/limites.js
        env:
          CHROMIUM: /usr/bin/google-chrome
  # F15.3: presupuesto de rendimiento en móvil (bytes y tiempo hasta estar lista) en portada, una asignatura y tres herramientas
  rendimiento:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 axe-core@4.10.2
      - run: node pruebas/rendimiento.js
        env:
          CHROMIUM: /usr/bin/google-chrome
